name: Check

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Check server
        working-directory: server
        run: |
          npm ci
          npx prisma generate
          npx tsc --noEmit

      - name: Check client
        working-directory: client
        run: |
          npm ci
          npm run build
